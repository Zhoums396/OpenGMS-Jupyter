[build-system]
requires = [
  "hatchling>=1.25",
  "hatch-jupyter-builder>=0.9",
  "jupyterlab>=4.5,<4.6",
]
build-backend = "hatchling.build"

[project]
name = "opengeolab-geocopilot"
version = "0.4.14"
description = "A Codex-powered, notebook-native general agent for JupyterLab"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "OpenGMS Team" }]
keywords = ["jupyterlab", "codex", "agent", "geospatial", "opengms"]
classifiers = [
  "Framework :: Jupyter",
  "Framework :: Jupyter :: JupyterLab",
  "Framework :: Jupyter :: JupyterLab :: 4",
  "Framework :: Jupyter :: JupyterLab :: Extensions",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "jupyter_server>=2.4,<3",
  "jupyter-server-documents==0.3.1",
  "jupyter-server-mcp==0.2.1",
  "jupyterlab>=4.5,<4.6",
  "fastmcp>=3,<4",
  "mcp>=1.0,<2",
  "nbformat>=5.10,<6",
  "PyGeoModel>=1.0.16,<2",
  "tomli-w>=1.0,<2",
]

[project.optional-dependencies]
test = [
  "coverage[toml]>=7.6",
  "ipykernel>=6.29",
  "jsonschema>=4.23",
  "pytest>=8.2",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5",
  "pytest-jupyter>=0.10",
]
dev = [
  "build>=1.2",
  "mypy>=1.11",
  "ruff>=0.7",
  "types-tornado>=5.1.1",
]

[project.entry-points."jupyter_server.extension_points"]
geocopilot = "geocopilot"

[project.entry-points."jupyter_server_mcp.tools"]
geocopilot_notebook = "geocopilot.notebook_tools:TOOLS"

[tool.hatch.build.targets.wheel]
packages = ["geocopilot"]

[tool.hatch.build.targets.sdist]
artifacts = ["geocopilot/labextension"]
exclude = [
  ".github",
  ".venv*",
  "node_modules",
  "lib",
  ".pytest_cache",
  ".ruff_cache",
  "*.egg-info",
]

[tool.hatch.build.targets.wheel.shared-data]
"geocopilot/labextension" = "share/jupyter/labextensions/@opengeolab/geocopilot"
"install.json" = "share/jupyter/labextensions/@opengeolab/geocopilot/install.json"
"jupyter-config" = "etc/jupyter"

[tool.hatch.build.hooks.jupyter-builder]
dependencies = ["hatch-jupyter-builder>=0.9"]
build-function = "hatch_jupyter_builder.npm_builder"
ensured-targets = [
  "geocopilot/labextension/static/style.js",
  "geocopilot/labextension/package.json",
]
skip-if-exists = ["geocopilot/labextension/static/style.js"]

[tool.hatch.build.hooks.jupyter-builder.build-kwargs]
build_cmd = "build:prod"
npm = ["npm"]

[tool.hatch.build.hooks.jupyter-builder.editable-build-kwargs]
build_cmd = "install:extension"
npm = ["npm"]
source_dir = "src"
build_dir = "geocopilot/labextension"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["error"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "RUF"]

[tool.coverage.run]
source = ["geocopilot"]
